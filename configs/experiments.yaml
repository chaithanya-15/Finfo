# Ablation matrix for the experimental analysis.
#
# Every entry inherits configs/base_config.yaml and overrides the keys listed under
# `overrides`. `axis` records which design decision the run isolates, so the results table
# can be grouped by it.
#
# `generate: false` runs retrieval scoring only. Retrieval metrics do not depend on the
# generator, and skipping generation keeps the sweep to a few hours instead of a full day.

experiments:

  - name: baseline
    axis: reference
    note: 512-token chunks, bge-base embeddings, k=5, Qwen3.5-4B generator
    generate: true
    overrides: {}

  - name: chunk_256
    axis: chunk_size
    note: halves the chunk to 256 tokens with proportional overlap
    generate: true
    overrides:
      corpus_processing:
        chunk_strategies: ["fixed_256_overlap32"]

  - name: chunk_structure
    axis: chunk_size
    note: segments on document structure instead of a fixed token window
    generate: true
    overrides:
      corpus_processing:
        chunk_strategies: ["structure"]

  - name: k_3
    axis: retrieval_k
    note: fewer passages, less context but less distraction
    generate: false
    overrides:
      evaluation:
        retrieval_k: 3

  - name: k_10
    axis: retrieval_k
    note: more passages, higher recall ceiling at the cost of prompt noise
    generate: false
    overrides:
      evaluation:
        retrieval_k: 10

  - name: embed_minilm
    axis: embedding_model
    note: 384-dim MiniLM against the 768-dim bge-base baseline
    generate: false
    overrides:
      retrieval:
        embedding_model: "all-MiniLM-L6-v2"
        index_name: "financebench_minilm"

  - name: gen_gemma
    axis: generation_model
    note: same retrieval as baseline, larger different-family generator
    generate: true
    overrides:
      generation:
        # gemma-4-12B is a different family and larger than the Qwen3.5-4B baseline. Its
        # standard architecture runs on the Metal GPU, unlike gemma-4-E2B whose nested
        # design segfaults llama.cpp's Metal backend on the first decode.
        model_name: "gemma-4-12B"

  - name: filtered_meta
    axis: retrieval_filter
    # Generates so the filter can be separated from the cross-encoder: rerank_filtered changes
    # both at once, and without this arm a gain cannot be attributed to either one.
    note: reference retrieval, restricted to the company named in the question
    generate: true
    metadata_filter: true
    overrides: {}

  - name: hybrid
    axis: retrieval_filter
    note: reference retrieval fused with BM25 lexical search (RRF)
    generate: false
    hybrid: true
    overrides: {}

  - name: prompt_derive
    axis: prompting
    # Reference retrieval, so the prompt is the only variable against baseline. The model
    # abstains on 30% of questions whose evidence was retrieved, which is what this targets.
    note: reference retrieval, prompt permits deriving figures and showing arithmetic
    generate: true
    prompt: derive
    overrides: {}

  - name: rerank
    axis: reranking
    note: dense pool of 50 reordered by a bge-reranker-base cross-encoder
    generate: false
    rerank: true
    pool: 50
    overrides: {}

  - name: rerank_filtered
    axis: reranking
    # Recall@50 is 0.80 under the company filter against 0.51 at k=5, so the filter decides
    # what the cross-encoder is allowed to see and the two compose rather than compete.
    # Generates, so it can be read against the baseline end to end: reranking lifts the
    # gold-document hit rate far more than it lifts the span-overlap metric, and answer
    # quality is the thing that settles whether that matters.
    note: company-filtered pool of 50 reordered by the same cross-encoder
    generate: true
    rerank: true
    metadata_filter: true
    pool: 50
    overrides: {}
